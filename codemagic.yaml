# Codemagic CI config — builds BOTH apps in the cloud. iOS on a macOS runner (→
# TestFlight), Android on Linux (→ signed AAB + sideloadable APK).
#
# The point of this file is that neither build needs a machine of your own: both are
# started from the Codemagic web UI, which works fine on a phone. There is no Mac and
# no Android Studio in the loop.
#
# Why this exists: CampHawk has no committed native project (ios/ is git-ignored — see
# capacitor.config.ts / docs/SETUP.md). This workflow regenerates ios/ from scratch on
# a Codemagic macOS runner with `npx cap add ios`, brands it, signs it with an
# App Store Connect API key, and uploads to TestFlight — no local Mac required.
#
# Prereqs configured in the Codemagic UI (NOT in this file):
#   - App Store Connect integration named "CampHawk ASC" (Team → Integrations →
#     App Store Connect: upload the .p8 API key + Key ID + Issuer ID).
#   - The bundle id app.camphawk.mobile registered on developer.apple.com and an app
#     record created in App Store Connect (see docs/SETUP.md → mobile app).
#
# The app is a thin shell around https://camphawk.app, so the build ships no web bundle;
# it only needs the native container + push entitlement. See docs/SETUP.md.

workflows:
  ios-testflight:
    name: iOS · TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CampHawk ASC
    environment:
      groups:
        # Supplies CERTIFICATE_PRIVATE_KEY (secure) — the distribution-certificate
        # private key. fetch-signing-files reads it to create/reuse the signing cert.
        - ios_signing
      vars:
        BUNDLE_ID: "app.camphawk.mobile"
        XCODE_WORKSPACE: "App.xcworkspace"   # Capacitor names the iOS workspace "App"
        XCODE_SCHEME: "App"
      # Capacitor 8's CLI declares `engines: { node: ">=22.0.0" }` — on node 20 the
      # build dies at `npm ci`, before a single Capacitor command runs, which reads
      # like a dependency problem rather than a runtime one. Raised with the
      # Capacitor 7 -> 8 upgrade (target API 36 for Play, 2026-08-05).
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install JS dependencies
        script: npm ci
      - name: Generate the iOS native project
        # ios/ is not committed, so create it fresh.
        #
        # `--packagemanager cocoapods` IS LOAD-BEARING. Capacitor 8 defaults iOS to Swift
        # Package Manager, and SPM derives a package's identity from its last path
        # segment — so `@capacitor/app` and `@capacitor-firebase/app` both claim the
        # identity `app` and xcodebuild refuses to resolve:
        #   "Conflicting identity for app: ... both point to the same package identity"
        # (build #7, 2026-08-08). Neither package is droppable: @capacitor/app supplies
        # the Android back-button and lifecycle events, and @capacitor-firebase/app is
        # what initialises the native Firebase SDK from GoogleService-Info.plist, so
        # removing it would break push silently rather than loudly.
        #
        # CocoaPods has no such restriction — the two become CapacitorApp and
        # CapacitorFirebaseApp — and it is still first-class in v8. It is also the exact
        # configuration that built and shipped build 5. Revisit if upstream renames one
        # of the packages.
        script: npx cap add ios --packagemanager cocoapods || npx cap sync ios
      - name: Brand icons + splash
        script: npm run cap:assets
      - name: Capacitor sync (copy config + plugins into ios/)
        script: npx cap sync ios
      - name: Assert the InAppBrowser plugin is actually installed
        # THE SAME ASSERTION THE ANDROID WORKFLOW MAKES, for the same reason: a Cordova
        # plugin that silently fails to install produces an app that BUILDS, ships, passes
        # review, and then has no window.cordova.InAppBrowser at runtime — where
        # openRcHandoff's capability probe returns false and falls back to the system
        # browser. Mobile auto-cart would simply never happen and nothing would say why.
        #
        # It matters MORE on iOS than on Android. Android was verified by hand on an
        # emulator (2026-08-09: sign-in works, the session survives a force-close, the
        # injection reads a live token). iOS has had none of those three tests run against
        # it, so this assertion is currently the only thing standing between "the plugin is
        # in the build" and an assumption.
        #
        # PATHS READ OFF @capacitor/cli, NOT REMEMBERED. The first version of this step
        # checked ios/App/capacitor-cordova-ios-plugins and the Podfile for "InAppBrowser",
        # and failed a build where `cap sync` had reported, in its own words, "Found 1
        # Cordova plugin for ios: cordova-plugin-inappbrowser@7.0.0". Both branches were
        # wrong: config.js puts the directory at ios/capacitor-cordova-ios-plugins (one
        # level up — the Podfile's `:path` is '../capacitor-cordova-ios-plugins', relative
        # to ios/App/), and update.js writes the pod as `CordovaPlugins`, so the plugin's
        # own name never appears in the Podfile at all.
        #
        # DO NOT "simplify" this to `grep -r ios/`. The web bundle in ios/App/App/public
        # contains our own `cordova.InAppBrowser` probe, so a whole-tree grep would pass
        # with the plugin entirely absent — an assertion that cannot fail is worse than
        # none, because it reads as proof.
        script: |
          set -e
          DIR=ios/capacitor-cordova-ios-plugins
          if [ ! -d "$DIR" ] || ! grep -rq "InAppBrowser" "$DIR"; then
            echo "cordova-plugin-inappbrowser did NOT install into the iOS project."
            echo "Without it the RC hand-off silently falls back to SFSafariViewController,"
            echo "which shares cookies but cannot be injected into — so no mobile auto-cart."
            ls -la ios/ || true
            exit 1
          fi
          # The sources landing is not enough — unreferenced files compile into nothing.
          grep -q "CordovaPlugins" ios/App/Podfile || {
            echo "$DIR exists but ios/App/Podfile does not pull in the CordovaPlugins pod."
            exit 1
          }
          echo "InAppBrowser present in $DIR and wired into the Podfile."
      - name: Declare export compliance
        # The app uses only standard HTTPS/TLS (camphawk.app, Clerk, Stripe) — exempt
        # encryption. Declaring this up front lets TestFlight accept the build without
        # the manual "missing compliance" prompt on every upload.
        script: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist
      - name: Add location usage description
        # The "use my location" button needs @capacitor/geolocation on iOS (WKWebView has
        # no HTML5 geolocation), and iOS requires this Info.plist key or it silently denies
        # the permission. ios/ is regenerated each build, so re-add it here.
        script: |
          DESC="CampHawk uses your location to find campgrounds near you."
          # BOTH KEYS. Build 15 delivered with ITMS-90683: Apple wants
          # NSLocationAlwaysAndWhenInUseUsageDescription as well, because the geolocation
          # SDK REFERENCES the always-authorization API even though we never request it —
          # "While your app might not use these APIs, a purpose string is still required."
          # It is a warning today and a rejection risk at review, so both are set.
          #
          # The string is the same because the reason is the same: we ask once, at the
          # moment you tap "near me", and never in the background. Writing a scarier
          # always-on justification here would describe behaviour the app does not have.
          for KEY in NSLocationWhenInUseUsageDescription NSLocationAlwaysAndWhenInUseUsageDescription; do
            /usr/libexec/PlistBuddy -c "Add :$KEY string $DESC" ios/App/App/Info.plist \
              || /usr/libexec/PlistBuddy -c "Set :$KEY $DESC" ios/App/App/Info.plist
          done
          /usr/libexec/PlistBuddy -c "Print :NSLocationAlwaysAndWhenInUseUsageDescription" ios/App/App/Info.plist
      - name: Enable Push Notifications capability
        # ios/ is regenerated each build, so the aps-environment entitlement must be
        # re-applied here. Write the entitlements file and point the App target's
        # CODE_SIGN_ENTITLEMENTS at it via the xcodeproj gem (ships with CocoaPods).
        # 'production' is correct for App Store / TestFlight distribution builds. The
        # App Store provisioning profile already carries push because the App ID has the
        # Push Notifications capability enabled. Paired with the Firebase config step
        # below (FCM token) this is what makes iOS push deliver; see docs/SETUP.md.
        script: |
          cat > ios/App/App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>aps-environment</key>
            <string>production</string>
          </dict>
          </plist>
          EOF
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = project.targets.find { |t| t.name == "App" }
            raise "App target not found" unless target
            target.build_configurations.each do |c|
              c.build_settings["CODE_SIGN_ENTITLEMENTS"] = "App/App.entitlements"
            end
            project.save
          '
      - name: Configure Firebase (iOS FCM token)
        # @capacitor-firebase/app auto-runs FirebaseApp.configure() at launch, but only
        # if GoogleService-Info.plist is bundled. ios/ is regenerated each build, so decode
        # the plist from the GOOGLE_SERVICE_INFO_PLIST_B64 secure var (base64 of the file
        # downloaded from Firebase → Project settings → iOS app) and register it with the
        # App target's resources. Skips (build still succeeds, iOS push just stays off) if
        # the var is unset, so the pipeline never hard-fails on a missing secret.
        script: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            echo "GOOGLE_SERVICE_INFO_PLIST_B64 not set — skipping Firebase config (iOS push disabled)"
            exit 0
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > ios/App/App/GoogleService-Info.plist
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            target = project.targets.find { |t| t.name == "App" }
            raise "App target not found" unless target
            group = project.main_group["App"] || project.main_group.new_group("App", "App")
            unless project.files.any? { |f| f.path && f.path.end_with?("GoogleService-Info.plist") }
              ref = group.new_reference("GoogleService-Info.plist")
              target.resources_build_phase.add_file_reference(ref)
            end
            project.save
          '
      - name: Set up code signing
        # This app is brand-new, so no distribution certificate or provisioning profile
        # exists yet. Passing the private key (CERTIFICATE_PRIVATE_KEY, from the
        # ios_signing group) lets --create mint the signing certificate from it on the
        # first run; later builds match that same key and reuse the cert (no cert-limit
        # exhaustion). The profile is created/reused the same way.
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "$CERTIFICATE_PRIVATE_KEY" \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment build number
        # TestFlight rejects duplicate build numbers. PROJECT_BUILD_NUMBER is Codemagic's
        # monotonically-increasing per-workflow counter, so each run gets a fresh number.
        script: |
          cd ios/App
          agvtool new-version -all "${PROJECT_BUILD_NUMBER:-1}" || true
      - name: Build the IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Add beta_groups here once you create an internal testing group in App Store
        # Connect, e.g.:
        # beta_groups:
        #   - CampHawk Internal

  android-release:
    name: Android · signed AAB + APK
    # A Mac runner for an ANDROID build looks wrong, and it is — on any plan that
    # offers a Linux instance. This account's plan offers neither: `linux_x2` AND
    # plain `linux` both fail in under a second, before a single step runs, with
    # "The selected instance type is not available with the current billing plan"
    # (both tried on 2026-07-28, the first two runs of this workflow). mac_mini_m2 is
    # the one instance the plan can actually schedule — it's what the iOS workflow has
    # always used — and Codemagic's macOS image carries the Android SDK, JDK and
    # Gradle, so `bundleRelease` builds there fine.
    #
    # That failure reads like a broken workflow: zero steps, no logs, instant. It is
    # purely billing. Nothing to do with the keystore, the Firebase variable or Gradle.
    # If the plan ever gains Linux, switch back — it's cheaper and faster for this job.
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      groups:
        # Supplies GOOGLE_SERVICES_JSON_B64 (secure) — base64 of the
        # google-services.json from Firebase → Project settings → Android app.
        # Same idea as the iOS plist; android/ is regenerated each build so it has to
        # be written in rather than committed.
        - android_firebase
        # Supplies GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (secure) — the Google Play service
        # account JSON, for the publishing block at the end of this workflow. Kept in its
        # OWN group rather than folded into android_firebase so the publish credential can
        # be rotated or revoked without touching push. Listing the group here is what puts
        # the variable in scope: defined but unlisted, it resolves EMPTY and the publish
        # fails as a bad credential rather than a missing one.
        - google_play
      android_signing:
        # Upload the upload-keystore in the Codemagic UI (Team → Code signing
        # identities → Android keystores) with this reference name. Codemagic then
        # exports CM_KEYSTORE_PATH / CM_KEY_ALIAS / CM_KEY_PASSWORD / CM_KEYSTORE_PASSWORD
        # and wires them into the Gradle build.
        - camphawk_upload
      vars:
        PACKAGE_NAME: "app.camphawk.mobile"
        # SIDELOAD ESCAPE HATCH FOR THE BILLING GATE — "false" everywhere except a
        # deliberate one-off build. Read by "Assert the Play Billing permission" below.
        #
        # WHY IT EXISTS. The billing gate blocks the whole workflow, and on 2026-08-29
        # that blocked the wrong thing. A real campsite was lost because the owner's phone
        # ran a build with no cordova-plugin-inappbrowser, so the RC hand-off could not
        # sign in or cart; the plugin entered package.json on 2026-08-18 and the last Play
        # upload is versionCode 18 from 2026-08-08, so NO installable build has ever
        # contained it. The only way to get one is this workflow, and the gate — added for
        # Play Subscriptions, a different project — fails it before an APK can be
        # sideloaded. The gate was guarding Play; it was also, incidentally, guarding the
        # user's phone against being fixed.
        #
        # WHY IT IS SAFE, and this is the part that matters: it does NOT skip the check.
        # The check still runs and still reports. What changes is the remedy — instead of
        # failing the build it DELETES THE AAB. Play receives the AAB and nothing else
        # (see `publishing.google_play`), so with no AAB in the artifacts there is nothing
        # for Play to be given. A billing-less binary still cannot reach the Subscriptions
        # page. The APK survives, which is the only thing a sideload needs.
        #
        # So the failure direction is preserved: the thing the gate exists to prevent is
        # prevented by REMOVING THE ARTIFACT rather than by failing, which is strictly
        # more direct — a failing build relies on Codemagic skipping `publishing:` when a
        # script exits non-zero, and that behaviour is an INFERENCE this file already
        # flags as never having been read from a build log.
        #
        # SET IT TO "true" FOR ONE BUILD, THEN PUT IT BACK. Leaving it on means the next
        # green build silently uploads nothing to Play and looks like it published.
        CH_SIDELOAD_ONLY: "true"
      # Capacitor 7's own Android library compiles with `sourceCompatibility 21`, so a
      # runner whose default JDK is older dies at :capacitor-android:compileReleaseJavaWithJavac
      # with `error: invalid source release: 21` — AFTER 91 Gradle tasks have run, which
      # makes it look like a project problem rather than a toolchain one. Observed
      # 2026-07-28 on mac_mini_m2, whose default JDK is not 21. Pin it explicitly rather
      # than inherit whatever the image ships, so an image update can't silently break
      # or silently fix this.
      java: 21
      # See the iOS workflow: Capacitor 8's CLI requires node >= 22. Both workflows
      # share one dependency tree, so they move together.
      node: 22
    scripts:
      - name: Install JS dependencies
        script: npm ci
      - name: Generate the Android native project
        # android/ is git-ignored for the same reason ios/ is — see capacitor.config.ts.
        script: npx cap add android || npx cap sync android
      - name: Brand icons + splash
        script: npm run cap:assets
      - name: Capacitor sync (copy config + plugins into android/)
        # This is the step that carries capacitor.config.ts across: the /search launch
        # URL, errorPath, and the newly added @capacitor/browser plugin. A web deploy
        # does NOT deliver any of those — only a rebuild does.
        script: npx cap sync android
      - name: Assert the InAppBrowser plugin is actually installed
        # `cap sync` installs Cordova plugins into the generated android/ project, and a
        # plugin that silently fails to install produces an app that BUILDS, ships, and
        # then has no window.cordova.InAppBrowser at runtime — where openRcHandoff's
        # capability probe returns false and quietly falls back to the system browser.
        # The mobile auto-cart would simply never happen, and nothing would say why.
        # Same reasoning as "Verify the APK is actually signed": assert the thing you are
        # relying on, at the one moment you can still see it.
        script: |
          set -e
          if ! grep -rq "InAppBrowser" android/capacitor-cordova-android-plugins/ 2>/dev/null \
             && ! grep -rq "InAppBrowser" android/app/src/main/ 2>/dev/null; then
            echo "cordova-plugin-inappbrowser did NOT install into the Android project."
            echo "Without it the RC hand-off silently falls back to the system browser."
            exit 1
          fi
          echo "InAppBrowser present in the generated Android project."

      - name: Assert the Play target API level
        # Google Play requires apps to TARGET Android 16 (API 36) for new uploads and
        # updates from 2026-08-31 (extension available to 2026-11-01). android/ is
        # regenerated every build, so the level comes from whatever @capacitor/android
        # defaults to — v7 shipped 35, v8 ships 36. Nothing in the repo pins it, which
        # means a dependency change could silently drop us below the requirement and
        # the first sign would be Play rejecting an upload months later.
        #
        # Asserted rather than pinned on purpose: pinning would freeze us at 36 and this
        # requirement moves every year. The assert fails loudly the moment the generated
        # value goes below what Play accepts, which is the failure worth catching.
        script: |
          cd android
          MIN_TARGET=36
          TARGET=$(sed -n 's/.*targetSdkVersion *= *\([0-9][0-9]*\).*/\1/p' variables.gradle | head -1)
          echo "generated targetSdkVersion: ${TARGET:-<none>}"
          if [ -z "$TARGET" ] || [ "$TARGET" -lt "$MIN_TARGET" ]; then
            echo "FATAL: targetSdkVersion is '${TARGET:-<none>}', Play requires >= ${MIN_TARGET}."
            echo "Bump @capacitor/android (its default sets this) or set targetSdkVersion in variables.gradle."
            cat variables.gradle
            exit 1
          fi

      - name: Configure Firebase (Android FCM token)
        # Without google-services.json the build still succeeds and push simply stays
        # off, matching the iOS workflow's behaviour — a missing secret must not hard
        # fail the pipeline.
        script: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "GOOGLE_SERVICES_JSON_B64 not set — skipping Firebase config (Android push disabled)"
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
      - name: Set the version code
        # Play rejects a duplicate versionCode. PROJECT_BUILD_NUMBER is Codemagic's
        # monotonic per-workflow counter, same as the iOS build number.
        #
        # `sed -i "expr" file` DID NOT WORK HERE AND FAILED SILENTLY. This workflow runs
        # on macOS (see instance_type — the plan has no Linux instance), and BSD sed's
        # -i REQUIRES a backup-suffix argument, so it took the expression as the suffix,
        # errored, and `|| true` swallowed it. Every build shipped Capacitor's default
        # versionCode of 1. Found on 2026-08-01 when the first Play upload showed up as
        # "1.aab (1.0)" instead of build 6 — the first upload succeeds either way, and
        # the SECOND would have been rejected as a duplicate version code.
        #
        # `sed -i.bak` is the portable spelling: GNU and BSD both accept an attached
        # suffix. The `|| true` is gone and the result is ASSERTED, because a version
        # code that silently stays at 1 is exactly the kind of failure this repo keeps
        # paying for — same family as the green build that emitted an unsigned APK.
        script: |
          cd android
          VC="${PROJECT_BUILD_NUMBER:-1}"
          sed -i.bak "s/versionCode .*/versionCode ${VC}/" app/build.gradle
          rm -f app/build.gradle.bak
          grep -q "versionCode ${VC}\b" app/build.gradle || {
            echo "versionCode was NOT set to ${VC} — refusing to build a duplicate"
            grep -n "versionCode" app/build.gradle
            exit 1
          }
          echo "versionCode set to ${VC}"
      - name: Wire the keystore into Gradle
        # `android_signing` above makes Codemagic FETCH the keystore and export
        # CM_KEYSTORE_PATH / CM_KEYSTORE_PASSWORD / CM_KEY_ALIAS / CM_KEY_PASSWORD —
        # it does NOT make Gradle use them. Capacitor's generated app/build.gradle has
        # no signingConfig at all, so without this step `assembleRelease` happily
        # produces app-release-UNSIGNED.apk, the build goes green, and you don't find
        # out until the APK refuses to install (observed 2026-07-28). android/ is
        # regenerated every build, so this has to be patched in here, like versionCode.
        script: |
          cd android
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "CM_KEYSTORE_PATH is empty — the camphawk_upload keystore did not load."
            echo "Refusing to build an unsigned release."
            exit 1
          fi
          python3 - <<'PY'
          import re, sys
          path = 'app/build.gradle'
          src = open(path).read()
          if 'signingConfigs' in src:
              print('signingConfigs already present — leaving it alone')
              sys.exit(0)
          block = "\n".join([
              "",
              "    signingConfigs {",
              "        release {",
              "            storeFile file(System.getenv(\"CM_KEYSTORE_PATH\"))",
              "            storePassword System.getenv(\"CM_KEYSTORE_PASSWORD\")",
              "            keyAlias System.getenv(\"CM_KEY_ALIAS\")",
              "            keyPassword System.getenv(\"CM_KEY_PASSWORD\")",
              "        }",
              "    }",
              "",
          ])
          m = re.search(r'^android\s*\{', src, re.M)
          if not m:
              sys.exit('FATAL: no `android {` block in ' + path)
          src = src[:m.end()] + block + src[m.end():]
          m2 = re.search(r'buildTypes\s*\{\s*release\s*\{', src)
          if not m2:
              sys.exit('FATAL: no buildTypes.release block in ' + path)
          src = src[:m2.end()] + '\n            signingConfig signingConfigs.release' + src[m2.end():]
          open(path, 'w').write(src)
          print('patched signing config into', path)
          PY
          grep -n 'signingConfig' app/build.gradle
      - name: Build the AAB and APK
        # AAB is what Play wants; the APK is the useful one for this stage — it can be
        # sideloaded straight onto a device to test the back button, external links and
        # offline behaviour without waiting on a Play review.
        script: |
          cd android
          ./gradlew bundleRelease assembleRelease
      - name: Verify the APK is actually signed
        # A green build that emits an unsigned artifact is the failure this workflow
        # already shipped once. Gradle names an unsigned release APK *-unsigned.apk, so
        # that name alone is proof; apksigner confirms the certificate when available.
        script: |
          cd android
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          if [ -z "$APK" ]; then echo "No APK produced"; exit 1; fi
          case "$APK" in
            *unsigned*) echo "FATAL: $APK is UNSIGNED — it will not install on a device."; exit 1;;
          esac
          SIGNER=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -n "$SIGNER" ]; then
            "$SIGNER" verify --print-certs "$APK" || exit 1
          else
            echo "apksigner not found; relied on the filename check above"
          fi
      - name: Assert the Play Billing permission is in the merged manifest
        # THIS IS THE GATE, not a nicety. `Monetize with Play -> Products -> Subscriptions`
        # offers only "Upload a new APK" and has NO create button until an uploaded binary
        # declares com.android.vending.BILLING. Every other prerequisite — merchant account,
        # account group, 15% enrolment, US-only production, verified bank — was done on
        # 2026-08-24 and the page still refused. See docs/STOREKIT-PLAN.md 9a-bis.
        #
        # NOTHING WE WROTE DECLARES THIS PERMISSION, AND NEITHER DOES THE PLUGIN.
        # @revenuecat/purchases-capacitor ships an EMPTY android/src/main/AndroidManifest.xml
        # — read, not assumed, 2026-08-27. The permission can only arrive by AAR manifest
        # merge, three hops below the thing package.json names:
        #
        #   @revenuecat/purchases-capacitor 13.4.2
        #     -> com.revenuecat.purchases:purchases-hybrid-common:18.32.1  (compile)
        #       -> com.revenuecat.purchases:purchases:10.18.1              (compile)
        #         -> com.android.billingclient:billing:8.3.0               (compile)
        #
        # So it is a property of a TRANSITIVE dependency: a version bump of
        # purchases-hybrid-common can remove it without one line of ours changing, and the
        # first sign would be the Play console quietly refusing to create products again.
        # That is exactly why targetSdkVersion is asserted above rather than trusted to
        # Capacitor's default, and this is the same discipline one layer out.
        #
        # PLACEMENT IS LOAD-BEARING. The merged manifest is a BUILD OUTPUT, so this cannot
        # run before the build.
        #
        # EXPECTED, NOT READ: that a failing script skips the `publishing:` block, so a
        # binary without billing never reaches Play. docs.codemagic.io is blocked from the
        # session that wrote this (403 at the proxy), so that is an INFERENCE — the exact
        # kind this step exists to stop trusting. It does not have to be true for the first
        # run to be safe: that run happens on a tree with no billing dependency at all, so
        # any AAB it uploaded would be the same kind already live at versionCode 18 and
        # would change nothing. Confirm it from a build log before relying on it further.
        #
        # TWO SOURCES, BECAUSE THEY FAIL DIFFERENTLY, and "we could not look" must never
        # read as "we looked and it was fine" — a green that proves nothing is the failure
        # this repo keeps paying for. If neither source could be read, this step FAILS.
        #
        # HONEST LIMIT: Play receives the AAB, not the APK. Both come out of one Gradle
        # invocation and one merged manifest, so the APK is strong evidence — but it is
        # evidence, not identity, which is why the merged manifest is the primary check.
        # The AAB's own manifest is protobuf-encoded and not greppable; reading it would
        # need bundletool, which is not guaranteed on this image.
        script: |
          set -e
          cd android
          PERM=com.android.vending.BILLING
          CHECKED=0
          MISSING=""

          # 1. THE MERGED MANIFEST — the merge result itself, and what BOTH artifacts are
          #    built from. Found rather than hardcoded: AGP moves its intermediates between
          #    versions, and a stale path would find nothing and report it as no problem.
          #    `*/merged_manifest*/release/*` matches both the APK and bundle outputs while
          #    excluding `releaseUnitTest`, which is a different variant.
          MANIFESTS=$(find app/build/intermediates -type f -name AndroidManifest.xml \
                        -path '*/merged_manifest*/release/*' 2>/dev/null | sort || true)
          if [ -z "$MANIFESTS" ]; then
            echo "FATAL: no merged RELEASE manifest under app/build/intermediates."
            echo "This is NOT 'the permission is absent' — it is 'this check could not read"
            echo "anything', and that must never pass as a green. AGP most likely moved the"
            echo "intermediates path; every AndroidManifest.xml it did produce:"
            find app/build/intermediates -type f -name AndroidManifest.xml 2>/dev/null | head -30
            exit 1
          fi
          for M in $MANIFESTS; do
            CHECKED=$((CHECKED + 1))
            if grep -q "$PERM" "$M"; then
              echo "  ok       $M"
            else
              echo "  MISSING  $M"
              MISSING="$MISSING $M"
            fi
          done

          # 2. THE BUILT APK — what actually shipped, independent of intermediate paths.
          #    Located exactly as the signing step locates apksigner.
          APK=$(find app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1)
          AAPT=$(ls -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools/*/aapt2 2>/dev/null | tail -1)
          if [ -n "$AAPT" ] && [ -n "$APK" ]; then
            CHECKED=$((CHECKED + 1))
            if "$AAPT" dump permissions "$APK" | grep -q "$PERM"; then
              echo "  ok       $APK (aapt2)"
            else
              echo "  MISSING  $APK (aapt2)"
              MISSING="$MISSING $APK"
            fi
          else
            echo "  skipped  APK check (aapt2=${AAPT:-not found}, apk=${APK:-none})"
          fi

          if [ "$CHECKED" -eq 0 ]; then
            echo "FATAL: neither the merged manifest nor the APK could be read."
            exit 1
          fi
          if [ -n "$MISSING" ]; then
            echo ""
            echo "FATAL: $PERM is NOT declared by this build:$MISSING"
            echo "Play will refuse to create subscription products for it — the Subscriptions"
            echo "page will still offer only 'Upload a new APK' with no create button."
            echo "Expected it to arrive transitively via com.android.billingclient:billing."
            echo "Check that @revenuecat/purchases-capacitor is in package.json AND that"
            echo "'npx cap sync android' ran before the build."
            if [ "${CH_SIDELOAD_ONLY:-false}" = "true" ]; then
              # THE ARTIFACT IS THE GATE NOW. Deleting the AAB is what keeps a
              # billing-less binary off Play — more direct than failing the build, which
              # relies on `publishing:` being skipped, an inference never read from a log.
              # The APK is left alone: sideloading it is the entire point of this mode.
              echo ""
              echo "CH_SIDELOAD_ONLY=true — NOT failing. Deleting the AAB instead, so Play"
              echo "cannot be given a build without $PERM. The APK is kept for sideloading."
              find app/build/outputs -type f -name '*.aab' -print -delete 2>/dev/null || true
              REMAINING=$(find app/build/outputs -type f -name '*.aab' 2>/dev/null | wc -l | tr -d ' ')
              if [ "$REMAINING" != "0" ]; then
                echo "FATAL: an AAB survived the delete — refusing to leave one publishable."
                exit 1
              fi
              echo "No AAB remains. Sideload the APK from this build's artifacts."
            else
              exit 1
            fi
          else
            echo "$PERM present in $CHECKED source(s)."
          fi

          # WHAT ELSE DID THE MERGE BRING? Printed rather than inferred, because the same
          # dependency tree pulls com.google.android.gms:play-services-ads-identifier, and
          # docs/PLAY-STORE.md section 4 declares in bold "No advertising or tracking
          # anywhere. No ad SDK, no ad ID". If AD_ID lands here, that Data Safety form and
          # Play's separate AD_ID declaration are both wrong — and every green build on this
          # workflow PUBLISHES, so it would ship before anyone looked.
          #
          # DELIBERATELY NOT A FAILURE. Failing would block the billing gate this step
          # exists to clear, over a policy question that is the owner's to answer.
          FIRST=$(echo "$MANIFESTS" | head -1)
          echo ""
          echo "--- every permission in $FIRST ---"
          PERMS=$(tr -d '\n' < "$FIRST" | tr '<' '\n' \
                    | grep '^uses-permission' \
                    | sed -n 's/.*android:name="\([^"]*\)".*/  \1/p' | sort -u)
          echo "$PERMS"
          if echo "$PERMS" | grep -q 'permission.AD_ID'; then
            echo ""
            echo "NOTE: com.google.android.gms.permission.AD_ID is in the merged manifest."
            echo "docs/PLAY-STORE.md section 4 currently declares no ad ID is collected, and"
            echo "Play asks about AD_ID separately. Either update those declarations or strip"
            echo "the permission. NOT failing the build for it — see the comment above."
          fi
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      # LIVE since 2026-08-08. Every green android-release build now uploads itself to
      # Play closed testing; no more downloading an AAB and clicking through the Console.
      #
      # `alpha` IS CLOSED TESTING. Play's tracks are internal / alpha (= closed) /
      # beta (= open) / production, and the 12-testers-for-14-continuous-days gate a
      # personal developer account must clear before production counts CLOSED testing
      # only. `internal` would satisfy the API-36 upload requirement, look like progress,
      # and start no clock — with the discovery arriving two weeks later.
      #
      # The service account is deliberately NOT granted "Release to production" in Play,
      # so this cannot ship to real users even if the track were changed by mistake.
      # Widen the permission only when automated production releases are actually wanted.
      #
      # The variable is named GCLOUD_SERVICE_ACCOUNT_CREDENTIALS to match the Codemagic
      # env-var group, and the CLI warns that reading a credential from that NAME is
      # deprecated in favour of GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS. It is only a
      # warning today. If a future Codemagic release drops it, this publish starts
      # failing on an empty credential — rename the variable in the UI group AND here,
      # together, or it fails as a bad credential rather than a missing one.
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: alpha
