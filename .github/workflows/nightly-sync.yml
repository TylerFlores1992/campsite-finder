name: Nightly RIDB Sync

on:
  schedule:
    # 9:00 UTC = 1-2am Pacific, depending on DST
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      states:
        description: 'Comma-separated state codes, or ALL'
        required: false
        default: 'ALL'
      maxFacilities:
        description: 'Max facilities (national cap)'
        required: false
        default: '20000'
      only:
        description: 'Run one sync only: all | ridb | ra'
        required: false
        default: 'all'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Run RIDB sync
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == 'all' || github.event.inputs.only == 'ridb' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
        run: npx tsx scripts/run-sync.ts "${{ github.event.inputs.states || 'ALL' }}" "${{ github.event.inputs.maxFacilities || '20000' }}"

      - name: Run ReserveAmerica sync
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == 'all' || github.event.inputs.only == 'ra' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/run-sync-ra.ts

      # NB: the ReserveCalifornia sync does NOT run here — their WAF blocks
      # GitHub Actions runner IPs with 403. It runs daily on the Fly.io worker
      # instead (see worker/poller.ts rcSyncIfDue).
      #
      # NB: the TN/SC sync does NOT run here either, and that was MEASURED, not
      # assumed — run 30878585899 on 2026-08-04, dispatched with `only: tnsc`.
      # Both states came back "0 parks, 1 error" in 0.6s and 0.3s: an instant
      # WAF refusal of the runner IP, the same answer ReserveCalifornia gives.
      # A step here is therefore a nightly RED run, not a fix. It was written,
      # dispatched, and removed on the strength of that result — so if you are
      # about to add one, this is the experiment you were going to run.
      #
      # TN/SC consequently has NO scheduled sync anywhere, which is a real gap
      # rather than a decision: the Fly worker is WAF-blocked (which is why
      # /api/tnsc-availability exists) and so is this runner, so `catalog.syncs`
      # in /api/health/status returns to warn 48h after each hand-run. The one
      # egress known to reach this portal on a schedule is VERCEL — the same
      # one the availability proxy already uses — so a Vercel Cron calling a
      # sync route is the next thing to try.
