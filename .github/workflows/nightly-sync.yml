name: Nightly RIDB Sync

on:
  schedule:
    # 9:00 UTC = 1-2am Pacific, depending on DST
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      states:
        description: 'Comma-separated state codes, or ALL'
        required: false
        default: 'ALL'
      maxFacilities:
        description: 'Max facilities (national cap)'
        required: false
        default: '20000'
      only:
        description: 'Run one sync only: all | ridb | ra | tnsc'
        required: false
        default: 'all'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Run RIDB sync
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == 'all' || github.event.inputs.only == 'ridb' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
        run: npx tsx scripts/run-sync.ts "${{ github.event.inputs.states || 'ALL' }}" "${{ github.event.inputs.maxFacilities || '20000' }}"

      - name: Run ReserveAmerica sync
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == 'all' || github.event.inputs.only == 'ra' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/run-sync-ra.ts

      # TN/SC (ColdFusion portal) syncs TN + SC in one no-arg call — both
      # providers are `verified: true`. It runs LAST on purpose: this portal's
      # WAF is the least predictable of the three and a failure here must not
      # cost the RIDB and ReserveAmerica data already written above.
      #
      # Deliberately NOT continue-on-error. Before this existed there was no
      # scheduled sync at all, so `catalog.syncs` in /api/health/status sat at
      # "2 stale" for twelve days and nobody was paged — a red run is the whole
      # improvement. If the WAF starts refusing runner IPs the way it refuses
      # Fly, this step going red is how you find out; the script exits non-zero
      # on zero parks precisely so a 200-but-empty block cannot pass as green.
      - name: Run TN/SC State Parks sync
        if: ${{ github.event.inputs.only == '' || github.event.inputs.only == 'all' || github.event.inputs.only == 'tnsc' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/run-sync-tnsc.ts

      # NB: the ReserveCalifornia sync does NOT run here — their WAF blocks
      # GitHub Actions runner IPs with 403. It runs daily on the Fly.io worker
      # instead (see worker/poller.ts rcSyncIfDue). That precedent is exactly
      # why the TN/SC step above had to be verified from a runner rather than
      # assumed: "reachable from a web session" says nothing about this IP range.
