# Fly.io config for the availability poller worker.
# Deploy from the repo root:
#   fly deploy --config worker/fly.toml --dockerfile worker/Dockerfile
#
# Required secrets (fly secrets set KEY=value --app campsite-finder-worker):
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#   RESEND_API_KEY, EMAIL_FROM

app = "campsite-finder-worker"
# iad since 2026-07-31. sjc was moved off after its egress IP turned out to be the
# one rec.gov treated worst — though the move alone changed nothing measurable, because
# the real cause was our own uncoordinated fetch lanes. Kept in iad regardless: it
# measured clean (0 429s in 160 requests) where sjc did not, and there is no reason to
# go back to a worse address. NOTE this only places NEW machines; existing ones stay
# where they are and must be moved with `flyctl machine clone --region`.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# 512MB, raised from 256MB on 2026-07-31 after a three-death crash loop. The breaker-
# wait fixes made the nightly UseDirect sync THOROUGH — 50+ minutes of full grid
# payloads instead of 22 minutes of fail-fast — and 256MB could not sustain that
# alongside the poller: MemAvailable fell to 20MB mid-sync, the process thrashed
# (rec.gov 5s timeouts, the :8080 server unresponsive, the poll cycle stalled), and
# the watchdog killed it before the sync ever reached Illinois/Virginia. Never an
# actual OOM kill — thrash, which is why it looked like "egress wedged".
[[vm]]
  memory = "512mb"

[env]
  POLL_INTERVAL_MS = "15000"
  PORT = "8080"
  # How many slices the campground space is divided into — the SAME value on every
  # machine. 1 = the shard machinery is a no-op (one index, owns everything, identical
  # behaviour to before it existed). Raise it and add that many machines
  # (`flyctl machine clone <id> --region iad`); each leases a free index by itself.
  # Capacity is ~4 rec.gov campground-months per machine at a 15s cadence.
  SHARD_COUNT = "1"
  # Delivery canary (synthetic email+SMS send proving the last mile). Daily, not the
  # 6h code default: the SMS send costs A2P money and once/day still catches a Twilio
  # outage well within the window we'd want to know it broke.
  CANARY_DELIVERY_INTERVAL_MS = "86400000"
  # Feature E's probe roster. OFF since 2026-07-30: ~24,000 probes/day, of which the
  # 327 UseDirect targets each cost a Vercel function invocation via /api/rc-proxy,
  # to feed a signal SHOW_LIKELIHOOD keeps hidden. Set to "true" AND reactivate
  # probe_targets to resume — the rows are all active = false.
  PROBE_ENABLED = "false"

# This is primarily a background poller. The HTTP service exists for ONE endpoint
# (POST /gtc/availability, shared-secret guarded) that the Vercel search page
# calls, because Camis' WAF 403s Vercel's IPs but not Fly's.
#
# The autostop/autostart settings are load-bearing: the poller must run
# continuously, so machines must NEVER be stopped for being idle, and Fly must
# not start the second (standby) machine on traffic — two live pollers would
# double the Camis request rate for no benefit.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

# Readiness check on the poller's /health, which reports 503 once heartbeats stop
# landing (a wedged-but-"started" machine — the 2026-07-22 incident). This surfaces
# the wedge to the load balancer, deploy gating, and `flyctl status`. NOTE: the
# actual auto-recovery is the poller's in-process watchdog (it process.exit(1)s so
# Fly reboots the VM) — this check is the visible signal, not the trigger, because
# Fly's "restart on failing check" behavior is not something we want to rely on for
# alerting uptime. grace_period covers the poller's startup probes before cycle 1.
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "90s"
  method = "get"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
