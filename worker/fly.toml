# Fly.io config for the availability poller worker.
# Deploy from the repo root:
#   fly deploy --config worker/fly.toml --dockerfile worker/Dockerfile
#
# Required secrets (fly secrets set KEY=value --app campsite-finder-worker):
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
#   RESEND_API_KEY, EMAIL_FROM

app = "campsite-finder-worker"
# iad since 2026-07-31. sjc was moved off after its egress IP turned out to be the
# one rec.gov treated worst — though the move alone changed nothing measurable, because
# the real cause was our own uncoordinated fetch lanes. Kept in iad regardless: it
# measured clean (0 429s in 160 requests) where sjc did not, and there is no reason to
# go back to a worse address. NOTE this only places NEW machines; existing ones stay
# where they are and must be moved with `flyctl machine clone --region`.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  POLL_INTERVAL_MS = "15000"
  PORT = "8080"
  # How many slices the campground space is divided into — the SAME value on every
  # machine. 1 = the shard machinery is a no-op (one index, owns everything, identical
  # behaviour to before it existed). Raise it and add that many machines
  # (`flyctl machine clone <id> --region iad`); each leases a free index by itself.
  # Capacity is ~4 rec.gov campground-months per machine at a 15s cadence.
  # 2 since 2026-08-02. rec.gov's rate limit is per EGRESS IP, so speed and capacity
  # are bought with machines, not with a bigger budget on one machine — the full-day
  # 429 profile settled that: at a steady 13.3 req/min a single IP was throttled in
  # EVERY hour of the day (0.2-3.2%, worst at 15:00 UTC), while our own budget denied
  # almost nothing. There was no headroom to take.
  #
  # Two machines in iad, each with its own address and its own 15/min budget, so the
  # pair carries ~30/min without either one going faster than the rate already
  # measured as survivable. Campgrounds are split by FNV-1a hash (worker/shard.ts);
  # each machine leases its index from poller_shards, and /api/health/status fails on
  # an unheld shard because those campgrounds would be polled by nobody.
  #
  # ORDER MATTERS WHEN CHANGING THIS. Clone the machine FIRST, then raise the count:
  # raising it first leaves the extra shard unheld, and half the campgrounds go
  # unpolled until a machine arrives. The reverse transient (N machines still at
  # SHARD_COUNT=1) is harmless — everyone polls everything, the alerting claim dedupes
  # the alerts, and each IP stays at its own normal rate.
  # 2 -> 3 on 2026-09-04. `poller.capacity` had been AMBER at 6/8 rec.gov
  # campground-months: five rec.gov watches were consuming six slots (a watch
  # spanning two months costs two), leaving us one or two watches from over
  # capacity. Over capacity is not an outage and nothing goes red for it — every
  # watch simply gets slower, silently, which is the worst shape a degradation can
  # take for a product whose whole value is detection latency.
  #
  # Machine 805456c66d6578 was cloned FIRST (2026-09-04 03:51Z) and idled correctly
  # at `shard - of 2, 0/21 watches` until this landed — which is the transient this
  # comment's own ordering rule predicts, observed rather than assumed.
  SHARD_COUNT = "3"
  # Lead-time tiering (2026-08-01). A rec.gov campground-month whose first wanted
  # night is more than HOT_LEAD_DAYS out tolerates a COLD_MAX_AGE_MS-old cached
  # reading instead of demanding a fresh fetch every 15s cycle (~1 req/min instead
  # of 4). Feature E's frozen data: 89% of openings ≥7 days out survive an hour, so
  # far-out watches lose almost nothing while hot watches keep the true 15s.
  # Auto-cart-lane watches are always hot regardless of lead.
  RECGOV_HOT_LEAD_DAYS = "14"
  RECGOV_COLD_MAX_AGE_MS = "60000"
  # Delivery canary (synthetic email+SMS send proving the last mile). Daily, not the
  # 6h code default: the SMS send costs A2P money and once/day still catches a Twilio
  # outage well within the window we'd want to know it broke.
  CANARY_DELIVERY_INTERVAL_MS = "86400000"
  # Feature E's probe roster. OFF since 2026-07-30: ~24,000 probes/day, of which the
  # 327 UseDirect targets each cost a Vercel function invocation via /api/rc-proxy,
  # to feed a signal SHOW_LIKELIHOOD keeps hidden. Set to "true" AND reactivate
  # probe_targets to resume — the rows are all active = false.
  PROBE_ENABLED = "false"

# This is primarily a background poller. The HTTP service exists for ONE endpoint
# (POST /gtc/availability, shared-secret guarded) that the Vercel search page
# calls, because Camis' WAF 403s Vercel's IPs but not Fly's.
#
# The autostop/autostart settings are load-bearing: the poller must run
# continuously, so machines must NEVER be stopped for being idle.
#
# The old warning here — "Fly must not start the second (standby) machine on
# traffic, two live pollers would double the Camis request rate" — stopped being
# true at SHARD_COUNT=2 (2026-08-02). Two live pollers are now the intended state,
# and they do NOT double anything: each owns a disjoint slice of campgrounds, so
# the GoingToCamp/Camis calls are split between them rather than duplicated.
# auto_start_machines stays false regardless: a machine started by traffic rather
# than by us is one we did not decide to add capacity with.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  # Matches SHARD_COUNT: every shard needs a live machine or its campgrounds are
  # polled by nobody. Raise both together when adding capacity.
  min_machines_running = 3

# Readiness check on the poller's /health, which reports 503 once heartbeats stop
# landing (a wedged-but-"started" machine — the 2026-07-22 incident). This surfaces
# the wedge to the load balancer, deploy gating, and `flyctl status`. NOTE: the
# actual auto-recovery is the poller's in-process watchdog (it process.exit(1)s so
# Fly reboots the VM) — this check is the visible signal, not the trigger, because
# Fly's "restart on failing check" behavior is not something we want to rely on for
# alerting uptime. grace_period covers the poller's startup probes before cycle 1.
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "90s"
  method = "get"
  path = "/health"

# 512MB, raised from 256MB on 2026-07-31 after a three-death crash loop. The breaker-
# wait fixes made the nightly UseDirect sync THOROUGH — 50+ minutes of full grid
# payloads instead of 22 minutes of fail-fast — and 256MB could not sustain that
# alongside the poller: MemAvailable fell to 20MB mid-sync, the process thrashed
# (rec.gov 5s timeouts, the :8080 server unresponsive, the poll cycle stalled), and
# the watchdog killed it before the sync ever reached Illinois/Virginia. Never an
# actual OOM kill — thrash, which is why it looked like "egress wedged".
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
